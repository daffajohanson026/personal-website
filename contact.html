        <div class="contact-info">

        <hr>

        <div class="contact-form">

            <h2>Send a Message</h2>

            <form onsubmit="showMessage(event)">

                <label>Name</label>

                <input type="text"
                       placeholder="Enter your name"
                       required>

                <label>Email</label>

                <input type="email"
                       placeholder="Enter your email"
                       required>

                <label>Message</label>

                <textarea rows="6"
                          placeholder="Write your message..."
                          required></textarea>

                <button type="submit">
                    Send Message
                </button>

                <button type="reset">
                    Reset
                </button>

            </form>

        </div>

    </div>
